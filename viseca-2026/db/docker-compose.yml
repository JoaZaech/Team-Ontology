services:
  db:
    image: postgres:16-alpine
    container_name: viseca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: viseca
      POSTGRES_PASSWORD: viseca
      POSTGRES_DB: viseca
    ports:
      - "5432:5432"
    volumes:
      - ../data:/data:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - viseca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viseca -d viseca"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    container_name: viseca_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha

volumes:
  viseca_pgdata:
